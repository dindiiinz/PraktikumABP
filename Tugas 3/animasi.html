<!DOCTYPE html>
<html>
<head>
<title>Animasi jQuery</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
#kotak{
    width:100px;
    height:100px;
    background:pink;
    position:relative;
}
</style>

</head>
<body>

<h2>Klik tombol "Start" untuk menjalankan animasi pada kotak</h2>

<button id="animate">Start</button>

<div id="kotak"></div>

<script>
$(document).ready(function(){

    $("#animate").click(function(){
        $("#kotak").animate({
            left:'250px'
        },1000).animate({
            left:'0px'
        },1000);
    });

});
</script>

</body>
</html>
